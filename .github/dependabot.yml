version: 2
updates:
  # NuGet (backend C# / .NET 10). Api e Tests juntos para que o grupo
  # abaixo suba EF Core e ASP.NET Core na mesma versao nos dois projetos (DEC-13).
  # Revisores vem do CODEOWNERS (@Agesto-Platform/core).
  - package-ecosystem: "nuget"
    directories:
      - "/MicroERP.Api"
      - "/MicroERP.Tests"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "backend"
    groups:
      microsoft-aspnetcore-efcore:
        patterns:
          - "Microsoft.AspNetCore.*"
          - "Microsoft.EntityFrameworkCore*"
      # Demais minor/patch num PR so por semana (um ciclo de CI em vez de varios).
      nuget-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # Bloqueia atualizacoes major automaticas. Decisao do time em 2026-05-11
    # apos o PR #5 (Swashbuckle 6 -> 10) ter sido mergeado sem validacao.
    # Major upgrades viram tarefa manual no Jira com revisao + smoke test.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/web"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:15"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps-web)"
    labels:
      - "dependencies"
      - "web"
    groups:
      web-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/mobile"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:30"
      timezone: "America/Sao_Paulo"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps-mobile)"
    labels:
      - "dependencies"
      - "mobile"
    groups:
      mobile-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # O Expo SDK fixa estas versoes; atualizar com `npx expo install --fix`.
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-native"
      # Modulos nativos e preset de teste tambem fixados pelo SDK. Subir sozinhos
      # quebrou o PR #77 (jest-expo exigia react-native mais novo; worklets 0.13
      # fora da faixa do expo-modules-core).
      - dependency-name: "react-native-gesture-handler"
      - dependency-name: "react-native-reanimated"
      - dependency-name: "react-native-safe-area-context"
      - dependency-name: "react-native-screens"
      - dependency-name: "react-native-worklets"
      - dependency-name: "jest-expo"

  # GitHub Actions usadas pelo CI
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "dependencies"
      - "ci"
    # Mesma politica do NuGet: nada de major automatico.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
