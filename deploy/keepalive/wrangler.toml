# Worker que mantém a API e o banco acordados (deploy/README.md, seção 6).
# Publicar: npx wrangler deploy (logado na conta Cloudflare do Agesto).
name = "agesto-keepalive"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Só roda pelo agendamento: sem endereço público *.workers.dev.
workers_dev = false

[triggers]
# A cada 5 minutos (UTC), bem abaixo dos 15 minutos que fazem a API dormir.
crons = ["*/5 * * * *"]

[vars]
HEALTH_URL = "https://agesto-api.onrender.com/health"

[observability]
enabled = true
