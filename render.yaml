# Blueprint do Render para a API do Agesto (DEC-32).
# Render > New > Blueprint > selecionar este repositório.
services:
  - type: web
    name: agesto-api
    runtime: docker
    plan: free
    # Mesma região do Supabase (East US / N. Virginia).
    region: virginia
    # Produção sai da main; a develop é só integração/teste (DEC-41).
    branch: main
    dockerContext: ./MicroERP.Api
    dockerfilePath: ./MicroERP.Api/Dockerfile
    healthCheckPath: /health
    # Só publica depois que o CI do GitHub passar no commit.
    autoDeployTrigger: checksPass
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      # O Dockerfile faz o Kestrel escutar na 8080; o Render encaminha para PORT.
      - key: PORT
        value: "8080"
      # Segredos: preenchidos no painel do Render, nunca no Git.
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: Jwt__Secret
        generateValue: true
      # Termos de uso e política de privacidade (B6). Opcionais: sem a versão,
      # ninguém precisa aceitar. Trocar a versão pede o aceite de novo a todos.
      - key: Termos__Versao
        sync: false
      - key: Termos__UrlTermos
        sync: false
      - key: Termos__UrlPrivacidade
        sync: false
      - key: Cors__AllowedOrigins__0
        sync: false
      # Chave do OpenRouteService para o mapa da agenda (DEC-38). Opcional:
      # sem ela, a geocodificação fica desligada e o mapa mostra só a lista.
      - key: Geocoding__OpenRouteServiceApiKey
        sync: false
